name: Release

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: release-authorizenter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Resolve release SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            target="$WORKFLOW_SHA"
          else
            target="$DISPATCH_SHA"
          fi
          test -n "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Check for releasable changes
        id: changes
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$latest_tag"..HEAD -- plugins/ composer.json composer.lock)"
          if [ -n "$changed" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.changes.outputs.proceed == 'true'
        id: ver
        run: |
          set -euo pipefail
          current="$(grep -iE '^[[:space:]]*\*?[[:space:]]*Version:' plugins/authorizenter-core/authorizenter-core.php | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)"

          if [ -z "$latest_tag" ]; then
            next="${current:-0.1.0}"
          else
            higher="$(printf '%s\n%s\n' "$current" "$latest_tag" | sort -V | tail -1)"
            if [ -n "$current" ] && [ "$higher" = "$current" ] && [ "$current" != "$latest_tag" ]; then
              next="$current"
            else
              IFS=. read -r ma mi pa <<< "$latest_tag"
              next="${ma}.${mi}.$((pa + 1))"
            fi
          fi

          printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Setup PHP, Composer, and WP-CLI
        if: steps.changes.outputs.proceed == 'true'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, wp-cli

      - name: Install production dependencies
        if: steps.changes.outputs.proceed == 'true'
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress

      - name: Bundle vendor into Core plugin
        if: steps.changes.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          rm -rf plugins/authorizenter-core/vendor
          cp -R vendor plugins/authorizenter-core/vendor
          test -f plugins/authorizenter-core/vendor/autoload.php

      - name: Stamp version into both plugins
        if: steps.changes.outputs.proceed == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" plugins/authorizenter-core/authorizenter-core.php
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" plugins/authorizenter-ui/authorizenter-ui.php
          sed -i -E "s/(AUTHORIZENTER_CORE_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" plugins/authorizenter-core/authorizenter-core.php
          sed -i -E "s/(AUTHORIZENTER_UI_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" plugins/authorizenter-ui/authorizenter-ui.php
          sed -i -E "s/^(Stable tag:[[:space:]]*).*/\1${NEXT}/" plugins/authorizenter-core/readme.txt
          sed -i -E "s/^(Stable tag:[[:space:]]*).*/\1${NEXT}/" plugins/authorizenter-ui/readme.txt

      - name: Build plugin ZIPs
        if: steps.changes.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cd plugins
          zip -rq ../dist/authorizenter-core.zip authorizenter-core -x '*/.git/*' '*/node_modules/*' '*/tests/*'
          zip -rq ../dist/authorizenter-ui.zip authorizenter-ui -x '*/.git/*' '*/node_modules/*' '*/tests/*'
          cd ..

      - name: Validate ZIP structure
        if: steps.changes.outputs.proceed == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          unzip -t dist/authorizenter-core.zip >/dev/null
          unzip -t dist/authorizenter-ui.zip >/dev/null
          unzip -l dist/authorizenter-core.zip | grep -q 'authorizenter-core/vendor/autoload.php'
          unzip -p dist/authorizenter-core.zip authorizenter-core/authorizenter-core.php | grep -qE "Version:[[:space:]]*${NEXT}"
          unzip -p dist/authorizenter-ui.zip authorizenter-ui/authorizenter-ui.php | grep -qE "Version:[[:space:]]*${NEXT}"

      - name: Validate packaged plugins in clean WordPress
        if: steps.changes.outputs.proceed == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-wp
          mkdir -p /tmp/release-wp
          cd /tmp/release-wp

          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost --title="Release Validation" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email --allow-root

          wp plugin install "$GITHUB_WORKSPACE/dist/authorizenter-core.zip" --activate --force --allow-root
          wp plugin install "$GITHUB_WORKSPACE/dist/authorizenter-ui.zip" --activate --force --allow-root

          wp plugin is-active authorizenter-core --allow-root
          wp plugin is-active authorizenter-ui --allow-root
          test "$(wp plugin get authorizenter-core --field=version --allow-root)" = "$NEXT"
          test "$(wp plugin get authorizenter-ui --field=version --allow-root)" = "$NEXT"

          wp plugin deactivate authorizenter-ui authorizenter-core --allow-root
          wp plugin activate authorizenter-core authorizenter-ui --allow-root

          wp eval '
          if ( ! shortcode_exists( "authorizenter_login" ) ) {
              fwrite( STDERR, "Authorizenter login shortcode missing after ZIP install.\n" );
              exit( 1 );
          }
          echo "Packaged Authorizenter plugins loaded successfully.\n";
          ' --allow-root

      - name: Publish GitHub Release with assets
        if: steps.changes.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/authorizenter-core.zip dist/authorizenter-ui.zip             --target "$TARGET_SHA"             --title "$TAG"             --generate-notes
