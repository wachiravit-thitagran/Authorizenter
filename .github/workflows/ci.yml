name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: "PHP syntax (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: composer syntax

  coding-standards:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr
      - name: Validate composer metadata
        run: composer validate --no-check-publish --strict
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer
          key: composer-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php82-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report-full --report-checkstyle=./phpcs-report.xml plugins/
      - name: Annotate PHPCS results
        if: always()
        run: cs2pr ./phpcs-report.xml

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer analyze

  unit:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2', '8.4' ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer
          key: composer-unit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-unit-${{ matrix.php }}-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test

  wp-integration:
    name: "WordPress integration (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    needs: [ syntax, coding-standards, static-analysis, unit ]
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2', '8.4' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl, dom, xml, mbstring
          tools: wp-cli, composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer
          key: composer-integration-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-integration-${{ matrix.php }}-

      - name: Install runtime dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Install WordPress
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost --title="Test Site" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --allow-root

      - name: Symlink and activate plugins
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/plugins/authorizenter-core" /tmp/wordpress/wp-content/plugins/authorizenter-core
          ln -s "$GITHUB_WORKSPACE/plugins/authorizenter-ui" /tmp/wordpress/wp-content/plugins/authorizenter-ui
          cd /tmp/wordpress
          wp plugin activate authorizenter-core authorizenter-ui --allow-root

      - name: Lifecycle test
        run: |
          set -euo pipefail
          cd /tmp/wordpress
          wp plugin deactivate authorizenter-ui authorizenter-core --allow-root
          wp plugin activate authorizenter-core authorizenter-ui --allow-root
          wp plugin status authorizenter-core --allow-root
          wp plugin status authorizenter-ui --allow-root

      - name: Smoke test shortcodes
        run: cd /tmp/wordpress && wp eval-file "$GITHUB_WORKSPACE/tests/wp-integration-scripts/test-render-shortcodes.php" --allow-root

      - name: Smoke test settings API
        run: cd /tmp/wordpress && wp eval-file "$GITHUB_WORKSPACE/tests/wp-integration-scripts/test-settings-api.php" --allow-root

      - name: Smoke test private-site redirect
        run: cd /tmp/wordpress && wp eval-file "$GITHUB_WORKSPACE/tests/wp-integration-scripts/test-private-site-redirect.php" --allow-root

      - name: Smoke test REST API
        run: cd /tmp/wordpress && wp eval-file "$GITHUB_WORKSPACE/tests/wp-integration-scripts/test-rest-api.php" --allow-root
